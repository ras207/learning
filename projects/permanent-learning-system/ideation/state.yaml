  type: escalation
  title: Should real-world results become a goal alongside capability? (AM-2)
  description: Adopting AM-2 would change the desired outcome from capability (with
    projects as means and evidence) to capability plus real-world results such as
    income, ventures, roles, published work and impact, with the system helping choose
    and pursue consequential opportunities.
  status: open
  materiality: high
  blocking: true
  blocking_reason: Consequential change to desired outcome and risk profile (GATES.md
    Gate 2 ESCALATE condition); the agent must not choose it.
  origin: expand-ambition
  affected:
