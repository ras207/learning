  next_action: Present options and recommendation; obtain the user's decision via
    the approval protocol.
  options:
  - 'A: Capability stays the goal; real projects remain means and evidence (current
    reading).'
  - 'B: Capability and real-world results are joint goals; the system helps choose
    consequential opportunities that do both. Committing to outside obligations (money,
    roles, ventures, other people) stays the user''s decision.'
  - 'C: Full life and career strategy system in which capability is one lever among
    many.'
  recommendation: B
  priority_rationale: Only open item that blocks Gate 2; highest decision value because
    it shapes the Gate 3 problem model.
