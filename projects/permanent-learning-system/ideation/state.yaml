    starting point and targets (E-001); indirect effects on team, government clients
    and future policy clients; people as private sources of challenge (AM-5, C4).'
  - 'Causal mechanisms are understood well enough to guide alternatives: M1 to M10
    cover practice and feedback, the missing learner model, stale material, unstructured
    self-direction, separation from real use, fragmented time, decay, AI hollowing
    out capability, sustaining effort and meta-work; plus the two-halves observation
    (work supports economics and advice but not AI practice).'
  - 'Current approaches are understood: courses, unstructured AI chat, formal study,
    learning on the job, mentors, spaced-repetition and note tools, and commercial
    AI tutors, each with its specific inadequacy.'
  - Inadequacy of the current state is explicit (section 6), grounded in the user's
    three stated failures (E-002).
