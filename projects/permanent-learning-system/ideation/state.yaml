decisions:
- id: D-001
  question: 'Who decides what the user works on next: the AI, or the user with the
    AI advising?'
  decision: The AI is free to decide what the user works on next, based on building
    the user's desired capabilities. 'Retaining reasoning, understanding and judgement'
    refers to the user doing the thinking, not to controlling the sequence of work.
  authority: human
  status: settled
  alternatives_considered:
  - User decides direction; AI proposes and advises.
  - 'Shared: AI proposes a plan; user approves or edits each step.'
  dependencies:
  - A-001
  - WI-004
  - art-intent-model
  affected:
  - A-001
  - WI-004
  - gate:4
  - gate:5
  decided_by: project owner
  decided_at: '2026-09-24'
  supersedes: null
  authorization_id: auth-D-001-ai-direction
- id: D-002
  question: Is building the system itself one of the user's learning projects, or
    should it be as off-the-shelf as possible?
  decision: The user wants to learn while building the system. Building it should
    not be structured like the learning projects the system itself will run; the system
    should not be used to organise its own construction before it exists.
  authority: human
  status: settled
  alternatives_considered:
  - Build the system as off-the-shelf as possible, with no learning intent.
  - Treat building the system as the first learning project, structured by the system's
    own model.
  dependencies:
  - WI-007
  - art-intent-model
  affected:
  - WI-007
  - WI-006
  - gate:2
  - gate:4
  decided_by: project owner
  decided_at: '2026-09-24'
  supersedes: null
  authorization_id: auth-D-002-build-as-learning
