version: 1

system: ideation-agent
phase: bootstrap

current_target:
  path: .agents/ideation/tools/
  status: complete
  contract_path: .agents/ideation/tools/README.md
  contract_status: complete
  notes:
    - The deterministic tools workstream is complete for the v0.1 baseline.
    - The planned bootstrap sequence currently has no remaining target after tools/.

documents:
  - path: .agents/ideation/contracts/VISION_CONTRACT.md
    role: vision_contract
    status: complete

  - path: .agents/ideation/workflow/GATES.md
    role: workflow_gates
    status: complete
    notes:
      - Defines six gates, hard/advisory behaviour, outcome semantics, human authority and the required evaluation record.
      - Gate failures identify deficiencies; WORKFLOW.md owns dynamic routing and resumption.

  - path: .agents/ideation/workflow/WORKFLOW.md
    role: workflow_definition
    status: complete
    notes:
      - Defines a fixed progression spine with gate evaluation at planned boundaries and after material changes.
      - Defines dependency-first, value-aware deficiency routing that preserves unaffected work.
      - Defines continuous challenge, blocked-only research, explicit human approval and mandatory finalization.
      - Defines approved handoff and human-authorized not-progressing terminal outcomes.

  - path: .agents/ideation/AGENT.md
    role: agent_definition
    status: complete
    notes:
      - Defines a bounded-autonomy thinking partner with explicit human decision authority.
      - Defines recommendation, challenge, epistemic, tool, scope and write-boundary behaviour.
      - Permits recommendations to stop, defer or reframe while reserving those decisions to the user.

  - path: .agents/ideation/state/ideation_state.md
    role: runtime_state_definition
    status: complete
    notes:
      - Defines one canonical structured YAML state record per project with a compact authoritative snapshot and consequential event history.
      - Defines typed routable work items, risk-based assumption blocking, selective dependency invalidation, artifact fingerprints and human-authorized terminal state.
      - Defines reliable interruption recovery, focus revalidation and new iterations for reopened terminal ideas.

  - path: .agents/ideation/skills/
    role: skills
    status: complete
    notes:
      - Defines twelve reusable capability skills rather than one skill per workflow stage.
      - Defines one generic gate evaluator, a generic dynamic router, dedicated material-change assessment and guarded blocked-evidence research.
      - Keeps ordinary challenge cross-cutting while providing a focused challenge skill for material stress tests and the mandatory pre-synthesis challenge.
      - Separates vision synthesis from semantic validation and separates generative reasoning from deterministic mutation.
      - Defines a shared skill contract, authoritative index, frontmatter schema and common result-envelope schema.

  - path: .agents/ideation/tools/
    role: deterministic_tools
    status: complete
    notes:
      - Implements a Python transaction coordinator with narrow deterministic primitives and a coordinator-only CLI.
      - Uses normalized one-source-event transactions, typed state mutations, content-addressed artifact payloads and deterministic bookkeeping.
      - Enforces schemas, trusted execution context, action-bound human authorization, policy invariants, optimistic concurrency and write boundaries.
      - Uses a working-tree-independent local Git backend with atomic ref advancement, dry-run, idempotency, read-back verification and Git-based reconciliation.
      - Defines explicit migration machinery, a pluggable execution-context verifier and automated success/failure tests.

planned_sequence:
  - .agents/ideation/workflow/GATES.md
  - .agents/ideation/workflow/WORKFLOW.md
  - .agents/ideation/AGENT.md
  - .agents/ideation/state/ideation_state.md
  - .agents/ideation/skills/
  - .agents/ideation/tools/

status_meanings:
  complete: Accepted as the current baseline and not an active bootstrap target.
  in_design: The current target being actively designed with the user.
  partial: Contains intentional content but is not yet complete.
  placeholder: Exists only to reserve structure and has not yet been substantively designed.
  pending: Planned work that should not begin until earlier dependencies are sufficiently complete.

git_policy:
  base_branch: main
  branch_prefix: ideation/bootstrap/
  direct_main_writes: false
  require_pull_request: true
  auto_merge: false
  require_human_review: true

state_policy:
  source_of_truth: .agents/ideation/bootstrap/BUILD_STATE.yaml
  update_state_in_same_pull_request_as_target_change: true
  advance_current_target_only_when_target_is_complete: true
  do_not_treat_chat_history_as_authoritative_state: true

completion_policy:
  target_is_complete_only_when:
    - Material design decisions required by the target have been resolved or explicitly deferred.
    - The target satisfies its contract or explicit completion criteria.
    - The user has had the opportunity to challenge consequential design choices.
    - The proposed file is internally consistent with relevant ideation-system files.
  merge_is_human_controlled: true
